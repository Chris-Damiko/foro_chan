<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Entrar · DearDross</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/efectos.css">
  <script type="module" src="/js/efectos.js"></script>
  <script type="module" src="/js/entrar.js"></script>
</head>
<body>
  <div class="vineta" aria-hidden="true"></div>

  <header class="contenedor barra">
    <a class="barra__logo glitch" href="/">DearDross</a>
  </header>

  <main class="contenedor entrada">
    <!-- Boceto 02 de mobbu: el ícono de incógnito. Sombrero arriba, gafas = USER y PASSWORD,
         y el botón ENTRAR con las líneas de abajo = los hombros del abrigo. -->
    <section class="cara" aria-labelledby="titulo-entrar">
      <h1 id="titulo-entrar" class="sr-only">Entrar</h1>
      <div class="cara__modos" role="tablist" aria-label="Modo de entrada">
        <button class="cara__modo" type="button" role="tab" id="tab-identidad" aria-controls="form-entrar" aria-selected="true" data-modo="identidad">identidad</button>
        <button class="cara__modo" type="button" role="tab" id="tab-admin" aria-controls="form-entrar" aria-selected="false" data-modo="admin">admin</button>
      </div>

      <form class="cara__form" id="form-entrar" role="tabpanel" novalidate>
        <!-- El ícono de incógnito (boceto 02 de mobbu), con proporciones fijas:
             sombrero arriba, gafas cuadradas = campos USER y PASSWORD, gabardina = botón ENTRAR. -->
        <div class="incognito">
          <p class="osd" aria-hidden="true"><span class="osd__play">&#9654; PLAY</span><span class="osd__rec">&#9679; REC</span></p>
          <img class="incognito__sombrero" src="/img/sombrero.svg" alt="" width="400" height="180">

          <div class="gafas">
            <div class="campo gafas__lente">
              <label for="e-usuario" class="sr-only">Usuario</label>
              <input id="e-usuario" type="text" maxlength="30" autocomplete="off" spellcheck="false" placeholder="USER" aria-describedby="ayuda-entrar">
            </div>
            <span class="gafas__puente" aria-hidden="true"></span>
            <div class="campo gafas__lente">
              <label for="e-clave" class="sr-only">Contraseña</label>
              <input id="e-clave" type="password" maxlength="100" autocomplete="off" placeholder="PASSWORD">
            </div>
          </div>

          <button class="gabardina" type="submit">
            <svg class="gabardina__dibujo" viewBox="0 0 336 185" aria-hidden="true" preserveAspectRatio="none">
              <!-- cuerpo con hombros caídos -->
              <path class="gabardina__tela" pathLength="1" d="M118 4 L218 4 L322 58 L330 185 L6 185 L14 58 Z"/>
              <!-- cuello levantado y solapas en V -->
              <path class="gabardina__solapa" pathLength="1" d="M118 4 L92 34 L168 104 L244 34 L218 4"/>
              <path class="gabardina__solapa" pathLength="1" d="M118 4 L168 60 L218 4"/>
              <!-- abertura -->
              <path class="gabardina__linea" pathLength="1" d="M168 104 L168 185"/>
              <!-- cinturón -->
              <path class="gabardina__linea" pathLength="1" d="M12 150 L324 150 M12 168 L324 168"/>
            </svg>
            <span class="gabardina__texto">ENTRAR</span>
          </button>
        </div>

        <label class="cara__recordar" id="recordar-fila">
          <input type="checkbox" id="e-recordar">
          Recordar en este navegador
        </label>

        <p class="campo__ayuda cara__ayuda" id="ayuda-entrar"></p>
        <p class="campo__error" id="e-error" role="alert" hidden></p>
      </form>

      <div class="cara__estado" id="estado" hidden></div>
    </section>
  </main>

  <footer class="contenedor pie">DearDross · anónimo · sin cuentas · sin registros de IP</footer>
</body>
</html>
